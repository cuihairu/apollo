message instance_spawn_request {
  sint64 instance_id = 1;  // 实例号（落点四件套 instance_id 同源）
  sint64 scene_id = 2;  // 承载 scene 号
  sint64 map_id = 3;  // 地图资产（SceneDescriptor）
  sint32 tick_interval_ms = 4;  // 副本 tick 独立节拍（20-50ms 可配，§2 适配缝②）
  sint32 participant_count = 5;  // 预期参战规模（资源档位）
  string spawn_args = 6;  // 拉起参数（进程模板与命令行，machined roster 命令列等价物）
}

// dir=P2P channel=events domain=internal binding=reflect — 拉起受理点回执（machined→需求方；ack-on-accept，非就绪信号）
message instance_spawn_reply {
  sint64 instance_id = 1;
  bool accepted = 2;  // 1=受理（排队拉起）0=拒绝（满载/模板未注册）
  string error_message = 3;
}

// dir=P2P channel=events domain=internal binding=reflect — 副本输入注入（Zone→实例；输入对齐实例 tick 轴）
message battle_input {
  sint64 instance_id = 1;
  sint64 player_id = 2;
  sint64 tick = 3;  // 实例 tick 轴拍号（Zone tick 与实例 tick 时间轴独立，§6）
  repeated sint64 opcodes = 4;  // 操作码序列（BattleInput.opcodes 承载语义）
}

// dir=P2P channel=events domain=internal binding=reflect — 副本状态同步（实例→Zone；逐帧投影给观战者与落回路由）
message battle_state_sync {
  sint64 instance_id = 1;
  sint64 tick = 2;
  sint64 snapshot_seq = 3;  // 投影水位（attribute-sync seq 纪律同源）
  repeated sint64 players = 4;  // 本帧在投影内的参战玩家
  bytes payload = 5;  // 易失态投影编码（随 battle-determinism 定型）
}

// dir=P2P channel=events domain=internal binding=reflect — 副本结算落回（实例→Zone；Result Dispatcher 单向，实例只出不进不回写）
message battle_result {
  sint64 instance_id = 1;
  sint64 tick = 2;  // 结算拍号（实例 tick 轴）
  sint64 replay_hash = 3;  // 事件 hash 链尾（battle_replay，跨机回放校验）
  repeated sint64 player_ids = 4;  // 逐玩家落回（与 scores 平行）
  repeated sint64 scores = 5;  // on_reward(player_id, score) 载荷（IRewardSink 语义）
}

