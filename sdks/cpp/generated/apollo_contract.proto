// dir=P2P channel=events domain=internal binding=reflect — cell 跨界意图（Zone→cell-app 受理面）
message cell_cross_border {
  sint64 request_id = 1;  // 意图号（回执按此关联）
  sint64 session_id = 2;  // 源客户端会话（回执路由）
  sint64 entity_id = 3;
  sint64 from_space = 4;
  sint64 to_space = 5;
  float pos_x = 6;
  float pos_y = 7;
  float pos_z = 8;
}

// dir=P2P channel=events domain=internal binding=reflect — cell 技能意图（Zone→cell-app 受理面）
message cell_skill_cast {
  sint64 request_id = 1;  // 意图号（回执按此关联）
  sint64 session_id = 2;  // 源客户端会话（回执路由）
  sint64 caster_id = 3;
  sint64 target_id = 4;
  sint32 skill_id = 5;
  float caster_pos_x = 6;
  float caster_pos_y = 7;
  float caster_pos_z = 8;
  float target_pos_x = 9;
  float target_pos_y = 10;
  float target_pos_z = 11;
}

// dir=P2P channel=events domain=internal binding=reflect — cell 意图受理回执（cell-app→来源；ADR-017 延时应答：gameThread_ 消费后回带，替代受理点空 ack）
message cell_intent_ack {
  sint64 request_id = 1;  // 对应意图的意图号
  sint32 code = 2;  // 0=成功；非 0 为驳回原因（errors.xml）
  string message = 3;  // 可读详情（可空）
}

// dir=P2P channel=events domain=internal binding=reflect — logger 结构化行推送（各进程→collector；一行一帧，行内 proc= 键自识进程）
message logger_line_push {
  string line = 1;  // 结构化行原文（六键 logfmt，structured.h 契约）
}

// dir=P2P channel=events domain=internal binding=reflect — 指标快照推送（各进程→admin exporter；body 为已渲染 exposition 文本，嵌 proc 标签）
message metrics_snapshot {
  string proc = 1;  // 进程标识（source 进程 processIdentity 串）
  string body = 2;  // Prometheus exposition 文本（已嵌 proc 标签，exporter 直拼接）
}

// dir=P2P channel=events domain=internal binding=reflect — 内部消息统一信封（trace 传播载体；payload = u16 id + 载荷全帧）
message internal_envelope {
  sint32 message_type = 1;  // 信封内型（四分类：1=EntityMethodCall 2=RouteControl 3=LifecycleEvent 4=ReplicationCommand；0=未分类）
  sint32 flags = 2;  // 信封旗标（bit0 = 采样命中 trace，W3C traceparent flags 语义）
  sint64 request_id = 3;  // 业务关联号（0=无；语义归内型——意图族 = 延时应答键）
  string source_app = 4;  // 发起进程 processIdentity
  string target_app = 5;  // 目标进程 processIdentity（空=不指名）
  sint64 entity_id = 6;  // 目标实体（0=非实体面）
  string method_alias = 7;  // 方法别名（空=非方法面）
  sint64 route_version = 8;  // 路由版本（0=未带）
  sint64 authority_epoch = 9;  // 权威纪元（0=未带）
  bytes trace_id = 10;  // W3C trace-id（16B；空=未带 trace）
  bytes parent_span_id = 11;  // W3C parent span-id（8B；空=根 span）
  bytes payload = 12;  // 载荷（u16 LE id + 契约载荷，内层自识）
}

// dir=P2P channel=events domain=internal binding=reflect — 玩家停写指令（manager→老 zone；该玩家停写进入只读并排其 journal 段）
message player_freeze_request {
  sint64 player_id = 1;
  sint64 request_id = 2;  // 编排关联键（manager 单调分配，0 保留）
}

// dir=P2P channel=events domain=internal binding=reflect — 玩家停写回执（老 zone→manager；accepted = 停写已生效且 journal 段已排）
message player_freeze_reply {
  sint64 player_id = 1;
  sint64 request_id = 2;
  bool accepted = 3;  // 1=停写生效 0=拒绝（未知玩家/无锚点）
  string error_message = 4;
}

// dir=P2P channel=events domain=internal binding=reflect — 玩家快照拉取（新 zone→老 zone；前置 = 停写已生效）
message player_snapshot_request {
  sint64 player_id = 1;
  sint64 request_id = 2;
}

// dir=P2P channel=events domain=internal binding=reflect — 玩家快照回执（老 zone→新 zone；旧的先 flush 再发——档案 JSON 原样 + 锚点元数据）
message player_snapshot_reply {
  sint64 player_id = 1;
  sint64 request_id = 2;
  bool success = 3;  // 1=快照就绪 0=拒绝（无档案）
  string error_message = 4;
  string profile_json = 5;  // 玩家档案 JSON（ADR-007 原子写源样携带；空 = 失败）
  sint64 session_id = 6;  // 锚点会话号（新 zone 建 anchor；0 = 无会话）
  sint32 gateway_id = 7;  // 会话 gateway（0 = 无会话）
  sint32 home_zone_id = 8;  // 锚点 home zone（信息列）
}

// dir=P2P channel=events domain=internal binding=reflect — 写权交接指令（manager→新 zone；带目录新分配 epoch 与源 zone 地址——新 zone 收到即向源发起 935 拉取，快照落位后才回 938）
message player_handoff_request {
  sint64 player_id = 1;
  sint64 request_id = 2;
  sint64 new_epoch = 3;  // 新 epoch（manager 目录 advance 分配；旧 epoch 迟到回执按陈旧拒收）
  sint64 session_id = 4;  // 会话号（resume 双锚）
  sint32 gateway_id = 5;
  string source_host = 6;  // 源 zone 地址（新 zone 向其发 935；空 = 快照已由编排面预落）
  sint32 source_port = 7;  // 源 zone M1 受理端口（0 = 同上）
}

// dir=P2P channel=events domain=internal binding=reflect — 写权交接回执（新 zone→manager；accepted = 新 epoch 已生效，此后不可撤销）
message player_handoff_reply {
  sint64 player_id = 1;
  sint64 request_id = 2;
  bool accepted = 3;  // 1=接权（新 epoch 生效）0=拒收（建锚失败）
  string error_message = 4;
}

// dir=P2P channel=events domain=internal binding=reflect — 客户端帧下行（World→Gateway；网关按 session_id 投递）
message client_deliver {
  sint64 session_id = 1;  // 目标客户端会话
  sint32 gateway_id = 2;  // 回带网关（非零时网关校验身份；0 = 不校验）
  bytes payload = 3;  // 客户端 wire 全帧（MessageHeader + body）
}

// dir=P2P channel=events domain=internal binding=reflect — link RPC 请求（corr_id 关联响应；body 载荷不透明，本层不解释）
message rpc_request {
  sint64 corr_id = 1;  // 请求关联号（客户端单调分配，0 保留；响应原样回带）
  bytes body = 2;  // 请求载荷（MessageCodec 全帧，业务层自识消息型）
}

// dir=P2P channel=events domain=internal binding=reflect — link RPC 响应（同 corr_id 关联；无等待者即弃）
message rpc_response {
  sint64 corr_id = 1;  // 回带请求关联号
  bytes body = 2;  // 响应载荷（MessageCodec 全帧；空 = handler 无产出）
}

// dir=P2P channel=events domain=internal binding=reflect — 玩家迁移编排指令（ops/fleetctl→manager；五步①③④串行执行——①933 停写 ③937 交权（新 zone 现场拉 935/936）④目录改指+快照立即推；并发度缺省 1）
message player_migrate_request {
  sint64 request_id = 1;  // 编排关联键（调用方分配，0 保留）
  sint64 player_id = 2;
  string source_host = 3;  // 老 zone 地址（933 拨入）
  sint32 source_port = 4;  // 老 zone M1 受理端口
  string target_host = 5;  // 新 zone 地址（937 拨入）
  sint32 target_port = 6;  // 新 zone M1 受理端口
  sint32 target_zone_id = 7;  // 目录改指落点（0 = 拒）
}

// dir=P2P channel=events domain=internal binding=reflect — 玩家迁移编排回执（manager→ops；ok = 五步①③④全成——此后不可撤销；带分步耗时供演练对账）
message player_migrate_reply {
  sint64 request_id = 1;
  sint64 player_id = 2;
  bool ok = 3;  // 1=迁移完成（epoch 已递增、目录已改指）
  sint64 new_epoch = 4;  // ③ 交割值（ok 有效；= 旧 epoch+1）
  string error_message = 5;
  sint64 freeze_ms = 6;  // ① 停写步耗时（编排起点到 934 确认）
  sint64 handoff_ms = 7;  // ③ 交权步耗时（含新 zone 现场拉取）
  sint64 total_ms = 8;  // ①→④ 全程耗时（停写窗口口径，§9.3）
}

// dir=P2P channel=events domain=internal binding=reflect — 脚本调试 eval 请求（admin→目标进程；场景线程 tick 边界执行）
message debug_eval_request {
  sint64 eval_id = 1;  // 关联键（admin 单调分配，0 保留；结果原样回带）
  sint64 scene_id = 2;  // 目标场景（0 = 默认 scene；未挂宿主拒收）
  string source = 3;  // Lua 源（表达式优先、语句回退；同一沙盒面管辖）
}

// dir=P2P channel=events domain=internal binding=reflect — 脚本调试 eval 回执（目标进程→admin；eval_id 关联）
message debug_eval_result {
  sint64 eval_id = 1;  // 回带请求关联号
  bool ok = 2;  // 1=求值成功（result 为结果串）；0=失败（error_message 为错误原文）
  string result = 3;  // 求值结果串（截断上限随宿主 debug_eval_result_max；ok=0 时为空）
  string error_message = 4;  // 错误原文（限流/语法/运行错；ok=1 时为空）
}

// dir=P2P channel=events domain=internal binding=reflect — 建队意图（Zone→World 受理面；服务端分配 party_id）
message party_create_intent {
  sint64 request_id = 1;  // 意图号（回执按此关联）
  sint64 session_id = 2;  // 源客户端会话（回执路由）
}

// dir=P2P channel=events domain=internal binding=reflect — 入队意图（Zone→World 受理面；满员拒绝）
message party_join_intent {
  sint64 request_id = 1;  // 意图号（回执按此关联）
  sint64 session_id = 2;  // 源客户端会话（回执路由）
  sint64 party_id = 3;
}

// dir=P2P channel=events domain=internal binding=reflect — 副本开启意图（Zone→World 受理面；仅队长）
message squad_launch_intent {
  sint64 request_id = 1;  // 意图号（回执按此关联）
  sint64 session_id = 2;  // 源客户端会话（回执路由）
  sint64 party_id = 3;
  sint64 map_id = 4;  // 0 = 服务端默认
}

// dir=P2P channel=events domain=internal binding=reflect — 副本进入意图（Zone→World 受理面；受理快照成员）
message squad_enter_intent {
  sint64 request_id = 1;  // 意图号（回执按此关联）
  sint64 session_id = 2;  // 源客户端会话（回执路由）
  sint64 party_id = 3;
}

// dir=P2P channel=events domain=internal binding=reflect — 玩法启动意图（Zone→World 受理面；仅队长、全员到齐）
message squad_start_intent {
  sint64 request_id = 1;  // 意图号（回执按此关联）
  sint64 session_id = 2;  // 源客户端会话（回执路由）
  sint64 party_id = 3;
}

// dir=P2P channel=events domain=internal binding=reflect — 击杀上报意图（Zone→World 受理面；只认本副本存活怪）
message squad_kill_intent {
  sint64 request_id = 1;  // 意图号（回执按此关联）
  sint64 session_id = 2;  // 源客户端会话（回执路由）
  sint64 party_id = 3;
  sint64 monster_entity_id = 4;
}

// dir=P2P channel=events domain=internal binding=reflect — 模块投递编排请求（ops→World；eval 944 同型裸帧受理）
message module_rollout_request {
  sint64 request_id = 1;  // 编排关联键（调用方单调分配，0 保留）
  sint32 op = 2;  // 1=prepare 2=commit 3=rollback 4=status
  string name = 3;  // 模块名（prepare 输入）
  sint64 version = 4;  // 模块版本（prepare 输入）
  string deps = 5;  // 依赖名列表（逗号分隔；空 = 无依赖）
  string source = 6;  // Lua 模块源（prepare 输入；status 时忽略）
  sint64 observe_ticks = 7;  // 灰度观察窗长（tick 计）
  sint64 fault_threshold = 8;  // 窗内 fault 上限；超阈早失败
}

// dir=P2P channel=events domain=internal binding=reflect — 模块投递编排回执（World→ops；request_id 关联）
message module_rollout_reply {
  sint64 request_id = 1;  // 回带请求关联号
  sint32 op = 2;  // 回带请求 op
  bool ok = 3;  // 1=受理成功；0=拒绝（detail 为原因，多行）
  sint32 state = 4;  // 本地编排状态机当前值（ModuleRollout 原值）
  sint64 window_faults = 5;  // 窗内归因 fault 数（status 有义）
  sint64 module_version = 6;  // 该模块当前生效版本（0 = 未装）
  string detail = 7;  // 错误行/状态摘要（ok=1 的 status 回执为摘要）
}

// dir=P2P channel=events domain=internal binding=reflect — Gateway 排空控制请求（ops→Gateway 控制受理面）
message gateway_drain_request {
  sint64 request_id = 1;  // 控制关联键（调用方单调分配，0 保留）
  sint32 op = 2;  // 1=begin 2=status
  sint64 deadline_s = 3;  // 排空期限（秒，begin 有义；0 = 无期限自然排空）
}

// dir=P2P channel=events domain=internal binding=reflect — Gateway 排空控制回执（Gateway→ops；request_id 关联）
message gateway_drain_reply {
  sint64 request_id = 1;  // 回带请求关联号
  sint32 op = 2;  // 回带请求 op
  bool ok = 3;  // 1=受理成功；0=拒绝（detail 为原因）
  sint32 state = 4;  // 排空状态机当前值：0=serving 1=draining 2=drained
  sint64 active_connections = 5;  // 当前活跃客户端连接数
  string detail = 6;  // 状态摘要（drained 时含强停结果；ok=0 为拒绝原因）
}

// dir=P2P channel=events domain=internal binding=reflect — World 排空控制请求（ops→World M1 控制受理面；停止分配新副本，既有副本服务至结算销毁）
message world_drain_request {
  sint64 request_id = 1;  // 控制关联键（调用方单调分配，0 保留）
  sint32 op = 2;  // 1=begin 2=status
  sint64 deadline_s = 3;  // 排空期限（秒，begin 有义；0 = 无期限自然排空，期限到未清即强停剩余副本）
}

// dir=P2P channel=events domain=internal binding=reflect — World 排空控制回执（World→ops；request_id 关联）
message world_drain_reply {
  sint64 request_id = 1;  // 回带请求关联号
  sint32 op = 2;  // 回带请求 op
  bool ok = 3;  // 1=受理成功；0=拒绝（detail 为原因）
  sint32 state = 4;  // 排空状态机当前值：0=serving 1=draining 2=drained
  sint64 active_instances = 5;  // 当前活动副本绑定数（含玩法期与结算期）
  string detail = 6;  // 状态摘要（drained 时含强停结果；ok=0 为拒绝原因）
}

// dir=P2P channel=events domain=internal binding=reflect — 结算分值入账受理（World→Base 业务面；资料归属切换后锚点写权在 Base——World 结算面以返回业务请求落账，不跨界持锚点指针）
message player_score_credit_request {
  sint64 request_id = 1;  // 调用方关联号（账本幂等在 World 侧 SettlementLedger——Base 只受理不记重放）
  sint64 player_id = 2;
  sint64 score = 3;  // 结算分值（入 exp 键）
  sint32 source_zone_id = 4;  // 发起玩法域（排查面；不参与受理裁决）
}

// dir=P2P channel=events domain=internal binding=reflect — 结算分值入账回执（Base→World；accepted=0 = 锚点暂不可落——离线/迁移中冻结，调用方挂账待补）
message player_score_credit_reply {
  sint64 request_id = 1;
  sint64 player_id = 2;
  bool accepted = 3;  // 1=已入锚点长期态（mark_dirty 随 SaveQueue 落档）
  string error_message = 4;
}

// dir=P2P channel=events domain=internal binding=reflect — cell 执行进程注册请求（cell→World M1 控制受理面；声明逻辑 ID、启动代次、控制/模拟地址、能力与就绪/排空状态——L101 注册首切片，认证凭据面按 world-cell-management 差距表另行挂账，本面裸帧受理同 944/952/956 惯例）
message cell_register_request {
  sint64 request_id = 1;  // 控制关联键（cell 侧单调分配，0 保留）
  sint64 cell_id = 2;  // 逻辑 cell ID（World 内唯一；PID/IP 不当身份，重启保留同 ID 换代次）
  sint64 start_epoch = 3;  // 进程启动代次（重启自增；旧代次注册不可覆盖新代次登记）
  string host = 4;  // cell 控制/模拟监听地址（World 分配 Space/Cell 时回连用；本切片仅记录）
  sint32 port = 5;  // cell 监听端口（0 = 未监听，仅登记）
  sint32 capabilities = 6;  // 能力位掩码（协议/快照能力声明；0 = 未声明，本切片记录不裁决）
  sint32 load = 7;  // 当前负载 0-100（0 = 未上报）
  sint32 drain_state = 8;  // 排空状态：0=serving 1=draining 2=drained（与 956/957 同口径）
  bool ready = 9;  // 就绪（1=可分配；进程存活不等于可分配）
}

// dir=P2P channel=events domain=internal binding=reflect — cell 执行进程注册回执（World→cell；request_id 关联；返回管理代次——world-cell-management §4.3）
message cell_register_reply {
  sint64 request_id = 1;  // 回带请求关联号
  bool accepted = 2;  // 1=登记受理；0=拒绝（code/detail 为原因）
  sint32 code = 3;  // 1=accepted 2=accepted_idempotent（同 ID 同代次重注册刷新） 3=rejected_stale_epoch（旧代次不可覆盖） 4=rejected_invalid（cell_id/代次非法）
  sint64 management_epoch = 4;  // World 管理代次（§5.7 透传；0 = 未初始化自铸）
  sint64 assigned_cell_id = 5;  // 确认的 cell ID（本切片原样回带；World 侧分配面在 L102 拓扑批）
  string detail = 6;  // 状态摘要（拒绝原因等）
}

// dir=P2P channel=events domain=internal binding=reflect — World→cell Space 分配（L101 分配面首切片：每 Space 一条——首个就绪 cell 独占认领全池未分配 Space，后续注册不重分；重平衡/回收/拓扑版本随 L108 拓扑批）
message cell_space_assign {
  sint64 assignment_version = 1;  // 该 Space 的分配版本（World 侧按 Space 独立单调；cell 侧按版本去重，仅版本前进才应用）
  sint64 management_epoch = 2;  // World 管理代次（§5.7 透传；0 = 未初始化自铸）
  sint64 space_id = 3;  // 被分配的 Space id（每 Space 一个完整 Cell，非分区）
  sint64 assigned_cell_id = 4;  // 当前归属 cell id（与注册 cell_id 一致——分配即认领）
  bool ready = 5;  // 1=可服务；0=回收（本切片恒 1——回收与重平衡随 L108 拓扑批）
}

