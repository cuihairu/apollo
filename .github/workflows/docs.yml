name: Docs Deploy

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/ci/docs_i18n_check.py'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/ci/docs_i18n_check.py'
  workflow_dispatch:

# 设置权限
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许同时部署一个
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 构建作业
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 9

      - name: Check locale pages and routes
        run: python3 scripts/ci/docs_i18n_check.py

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: ./docs
        run: pnpm install

      - name: Build docs
        working-directory: ./docs
        run: pnpm run docs:build
        env:
          NODE_ENV: production

      - name: Check generated locale metadata
        run: python3 scripts/ci/docs_i18n_check.py --dist docs/.vitepress/dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./docs/.vitepress/dist

  # 部署作业
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
