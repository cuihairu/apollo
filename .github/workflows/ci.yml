name: CI Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]
        exclude:
          # Exclude Windows Debug to reduce CI time
          - os: windows-latest
            build_type: Debug

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Get date for cache
      id: get-date
      run: echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
      shell: bash

    - name: Cache vcpkg
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/vcpkg_installed
          ~/.vcpkg
        key: ${{ matrix.os }}-vcpkg-${{ steps.get-date.outputs.date }}
        restore-keys: |
          ${{ matrix.os }}-vcpkg-

    - name: Install and setup vcpkg (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        if [ ! -d "vcpkg" ]; then
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh
        else
          ./vcpkg/vcpkg version
        fi
      shell: bash

    - name: Install and setup vcpkg (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        if (-not (Test-Path "vcpkg")) {
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat
        } else {
          .\vcpkg\vcpkg version
        }
        echo "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      shell: powershell

    - name: Install dependencies (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        # PORT-1（CI 修正二）：macos-latest 是 arm64 runner，x64-osx 三元组装
        # 出 x86_64 静态库（pugixml/openssl/absl），链接 apollo_gen 时
        # 「symbol(s) not found for architecture arm64」——按 runner 架构取三元组
        ./vcpkg/vcpkg install --triplet=${{ matrix.os == 'macos-latest' && (runner.arch == 'ARM64' && 'arm64-osx' || 'x64-osx') || 'x64-linux' }}
      shell: bash

    # APPLOCAL-RACE 配套：applocal 关闭后依赖 DLL 不再拷到可执行文件旁，
    # ctest 直跑 build/**/Release/*.exe 由 PATH 命中 vcpkg_installed/bin
    # （加载器搜索序：exe 目录 → 系统目录 → PATH）。
    - name: Install dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        .\vcpkg\vcpkg.exe install --triplet=x64-windows
        echo "${{ github.workspace }}\vcpkg_installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      shell: powershell

    - name: Install build tools (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ninja-build

    - name: Install build tools (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        # Install Xcode command line tools if not already installed
        xcode-select --install 2>/dev/null || true

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v1.14
      with:
        cmake-version: '3.20'

    # PORT-1：windows 任务固定 MSVC 工具链——Ninja 生成器默认从 PATH 拾取
    # MinGW g++（GNU 15.2），与仓库基线相悖：vcpkg x64-windows 三元组是
    # MSVC ABI（MinGW 无法链接），/utf-8 亦是 MSVC 旗标。此步骤把 cl.exe
    # 注入环境，CMake 在 windows 上稳定检出 MSVC。
    - name: Setup MSVC (Windows)
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1

    # APPLOCAL-RACE（CI 修正三）：vcpkg applocal 在每个可执行文件链接边尾随
    # z-applocal，把同一批依赖 DLL 并发拷进同目录——Ninja 并行链接下多条边
    # 同时拷 abseil_dll/libprotobuf 等到 tests\Release，互踩文件锁
    # （run 37997777791 avatar_tests.exe「The process cannot access the file
    # because it is being used by another process」，链尾 applocal 无 LNK 码）。
    # 关闭 applocal 消除竞态源，依赖 DLL 改由 PATH 供给（见 Install
    # dependencies (Windows) 步）。该开关仅 Windows 生效。
    - name: Configure CMake
      run: >
        cmake -B ${{ github.workspace }}/build
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
        -DVCPKG_TARGET_TRIPLET=${{ matrix.os == 'windows-latest' && 'x64-windows' || matrix.os == 'macos-latest' && (runner.arch == 'ARM64' && 'arm64-osx' || 'x64-osx') || 'x64-linux' }}
        -DVCPKG_INSTALLED_DIR=${{ github.workspace }}/vcpkg_installed
        -DVCPKG_APPLOCAL_DEPS=OFF
        -DAPOLLO_BUILD_TESTS=ON
        -DAPOLLO_BUILD_EXAMPLES=OFF
        -G "${{ matrix.os == 'windows-latest' && 'Ninja Multi-Config' || 'Ninja' }}"

    - name: Build
      run: >
        cmake --build ${{ github.workspace }}/build
        --config ${{ matrix.build_type }}
        --parallel

    - name: Test
      working-directory: ${{ github.workspace }}/build
      run: >
        ctest --output-on-failure
        -C ${{ matrix.build_type }}
        --parallel

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.build_type }}
        path: build/Testing/**/*.xml

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.os }}-${{ matrix.build_type }}
        path: |
          build/lib/
          build/bin/
          build/*.a
          build/*.lib
        retention-days: 30

  coverage:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Get date for cache
      id: get-date
      run: echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

    - name: Cache vcpkg
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/vcpkg_installed
          ~/.vcpkg
        key: ubuntu-latest-vcpkg-${{ steps.get-date.outputs.date }}
        restore-keys: |
          ubuntu-latest-vcpkg-

    - name: Install and setup vcpkg
      run: |
        if [ ! -d "vcpkg" ]; then
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh
        else
          ./vcpkg/vcpkg version
        fi
      shell: bash

    - name: Install Coverage Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y lcov build-essential ninja-build

    - name: Install dependencies
      run: |
        ./vcpkg/vcpkg install --triplet=x64-linux
      shell: bash

    - name: Configure CMake with Coverage
      # 字面块（|）而非折叠（>）：折叠标量会把注释行折进同一物理行，
      # bash 从 # 吞到行尾——coverage 旗标与 Ninja 生成器曾被注释整个吞掉，
      # 导致 CI 五连红「geninfo: ERROR: no .gcda files found」。
      run: |
        cmake -B ${{ github.workspace }}/build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_TARGET_TRIPLET=x64-linux \
          -DVCPKG_INSTALLED_DIR=${{ github.workspace }}/vcpkg_installed \
          -DAPOLLO_BUILD_TESTS=ON \
          -DAPOLLO_ENABLE_COVERAGE=ON \
          -DCMAKE_CXX_FLAGS="--coverage -g -O0 -fprofile-update=atomic" \
          -DCMAKE_C_FLAGS="--coverage -g -O0 -fprofile-update=atomic" \
          -G "Ninja"

    - name: Build with Coverage
      run: >
        cmake --build ${{ github.workspace }}/build
        --config Debug
        --parallel

    - name: Run Tests
      working-directory: ${{ github.workspace }}/build
      run: >
        ctest --output-on-failure
        -C Debug
        --parallel

    - name: Generate Coverage Report
      run: |
        cd build
        lcov --capture --directory . --output-file coverage.info --ignore-errors mismatch
        lcov --remove coverage.info '/usr/*' --output-file coverage.info --ignore-errors unused
        lcov --remove coverage.info '*/tests/*' --output-file coverage.info --ignore-errors unused
        lcov --remove coverage.info '*/examples/*' --output-file coverage.info --ignore-errors unused
        lcov --remove coverage.info '*/vcpkg_installed/*' --output-file coverage.info --ignore-errors unused
        lcov --remove coverage.info '*/_deps/*' --output-file coverage.info --ignore-errors unused
        lcov --list coverage.info
        genhtml -o coverage-html coverage.info

    - name: Upload Coverage Artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-lcov
        path: build/coverage.info
        retention-days: 30

    - name: Upload Coverage HTML
      uses: actions/upload-artifact@v4
      with:
        name: coverage-html
        path: build/coverage-html
        retention-days: 30

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./build/coverage.info
        flags: unittests
        name: codecov-umbrella
        disable_search: true
        fail_ci_if_error: false
