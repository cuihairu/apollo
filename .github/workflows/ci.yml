name: CI Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]
        exclude:
          # Exclude Windows Debug to reduce CI time
          - os: windows-latest
            build_type: Debug

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: >
        cmake
        -B ${{ github.workspace }}/build
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DAPOLLO_BUILD_TESTS=ON
        -DAPOLLO_BUILD_EXAMPLES=ON

    - name: Build
      run: cmake --build ${{ github.workspace }}/build --config ${{ matrix.build_type }} --parallel

    - name: Test
      working-directory: ${{ github.workspace }}/build
      run: ctest --output-on-failure -C ${{ matrix.build_type }}

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.build_type }}
        path: build/Testing/**/*.xml

  coverage:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4

    - name: Install GCov
      run: sudo apt-get update && sudo apt-get install -y gcov

    - name: Configure CMake with Coverage
      run: >
        cmake
        -B ${{ github.workspace }}/build
        -DCMAKE_BUILD_TYPE=Debug
        -DAPOLLO_BUILD_TESTS=ON
        -DAPOLLO_ENABLE_COVERAGE=ON
        -DCMAKE_CXX_FLAGS="--coverage -g -O0"

    - name: Build with Coverage
      run: cmake --build ${{ github.workspace }}/build --config Debug --parallel

    - name: Run Tests
      working-directory: ${{ github.workspace }}/build
      run: ctest --output-on-failure -C Debug

    - name: Generate Coverage Report
      working-directory: ${{ github.workspace }}/build
      run: |
        gcov -r ../src/**/*.cpp
        lcov --capture --directory . --output-file coverage.info
        lcov --remove coverage.info '/usr/*' --output-file coverage.info
        lcov --list coverage.info

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./build/coverage.info
        flags: unittests
        name: codecov-umbrella

  code-quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Clang-Tidy and cppcheck
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-tidy cppcheck

    - name: Configure CMake for Clang-Tidy
      run: >
        cmake
        -B ${{ github.workspace }}/build
        -DCMAKE_BUILD_TYPE=Debug
        -DAPOLLO_BUILD_TESTS=ON
        -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Run Clang-Tidy
      run: |
        find src include -name '*.cpp' -o -name '*.hpp' | \
        xargs -I {} clang-tidy -p build/ {} --

    - name: Run Cppcheck
      run: cppcheck --enable=all --xml --xml-version=2 src include 2> cppcheck-report.xml

    - name: Upload Cppcheck Results
      uses: actions/upload-artifact@v4
      with:
        name: cppcheck-report
        path: cppcheck-report.xml

  build-docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Doxygen
      run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

    - name: Generate Documentation
      run: |
        if [ -f docs/Doxyfile ]; then
          cd docs
          doxygen Doxyfile
        else
          echo "Doxyfile not found, skipping documentation generation"
        fi

    - name: Upload Documentation
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: documentation
        path: docs/html/

  package:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake for Release
      run: >
        cmake
        -B ${{ github.workspace }}/build
        -DCMAKE_BUILD_TYPE=Release
        -DAPOLLO_BUILD_TESTS=ON
        -DAPOLLO_BUILD_EXAMPLES=ON

    - name: Build Release
      run: cmake --build ${{ github.workspace }}/build --config Release --parallel

    - name: Create Package
      working-directory: ${{ github.workspace }}/build
      run: cpack -G TGZ

    - name: Upload Package
      uses: actions/upload-artifact@v4
      with:
        name: apollo-package
        path: build/*.tar.gz