name: CI Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]
        exclude:
          # Exclude Windows Debug to reduce CI time
          - os: windows-latest
            build_type: Debug

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Get date for cache
      id: get-date
      run: echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
      shell: bash

    - name: Cache vcpkg
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/vcpkg_installed
          ~/.vcpkg
        key: ${{ matrix.os }}-vcpkg-${{ steps.get-date.outputs.date }}
        restore-keys: |
          ${{ matrix.os }}-vcpkg-

    - name: Install and setup vcpkg (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        if [ ! -d "vcpkg" ]; then
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.sh
        else
          cd vcpkg
          ./vcpkg version
        fi
      shell: bash

    - name: Install and setup vcpkg (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        if (-not (Test-Path "vcpkg")) {
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat
        } else {
          cd vcpkg
          .\vcpkg version
        }
      shell: powershell

    - name: Install dependencies (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        cd vcpkg
        ./vcpkg install \
          nlohmann-json \
          protobuf \
          gtest \
          fmt \
          --triplet=x64-${{ matrix.os == 'macos-latest' && 'osx' || 'linux' }} \
          --x-install-root=../vcpkg_installed/x64-${{ matrix.os == 'macos-latest' && 'osx' || 'linux' }}
      shell: bash

    - name: Install dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        cd vcpkg
        .\vcpkg.exe install `
          nlohmann-json `
          protobuf `
          gtest `
          fmt `
          --triplet=x64-windows `
          --x-install-root=../vcpkg_installed/x64-windows
      shell: powershell

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v1.14
      with:
        cmake-version: '3.20'

    - name: Configure CMake
      run: >
        cmake -B ${{ github.workspace }}/build
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg_installed/x64-${{ matrix.os == 'windows-latest' && 'windows' || matrix.os == 'macos-latest' && 'osx' || 'linux' }}/scripts/buildsystems/vcpkg.cmake
        -DVCPKG_TARGET_TRIPLET=x64-${{ matrix.os == 'windows-latest' && 'windows' || matrix.os == 'macos-latest' && 'osx' || 'linux' }}
        -DAPOLLO_BUILD_TESTS=ON
        -DAPOLLO_BUILD_EXAMPLES=ON
        -DAPOLLO_ENABLE_CLANG_TIDY=ON

    - name: Build
      run: >
        cmake --build ${{ github.workspace }}/build
        --config ${{ matrix.build_type }}
        --parallel

    - name: Test
      working-directory: ${{ github.workspace }}/build
      run: >
        ctest --output-on-failure
        -C ${{ matrix.build_type }}
        --parallel

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.build_type }}
        path: build/Testing/**/*.xml

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.os }}-${{ matrix.build_type }}
        path: |
          build/lib/
          build/bin/
          build/*.a
          build/*.lib
        retention-days: 30

  coverage:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Get date for cache
      id: get-date
      run: echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

    - name: Cache vcpkg
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/vcpkg_installed
          ~/.vcpkg
        key: ubuntu-latest-vcpkg-${{ steps.get-date.outputs.date }}
        restore-keys: |
          ubuntu-latest-vcpkg-

    - name: Install and setup vcpkg
      run: |
        if [ ! -d "vcpkg" ]; then
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.sh
        else
          cd vcpkg
          ./vcpkg version
        fi
      shell: bash

    - name: Install Coverage Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y lcov

    - name: Install dependencies
      run: |
        cd vcpkg
        ./vcpkg install \
          nlohmann-json \
          protobuf \
          gtest \
          fmt \
          --triplet=x64-linux \
          --x-install-root=../vcpkg_installed/x64-linux
      shell: bash

    - name: Configure CMake with Coverage
      run: >
        cmake -B ${{ github.workspace }}/build
        -DCMAKE_BUILD_TYPE=Debug
        -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg_installed/x64-linux/scripts/buildsystems/vcpkg.cmake
        -DVCPKG_TARGET_TRIPLET=x64-linux
        -DAPOLLO_BUILD_TESTS=ON
        -DAPOLLO_ENABLE_COVERAGE=ON
        -DCMAKE_CXX_FLAGS="--coverage -g -O0"
        -DCMAKE_C_FLAGS="--coverage -g -O0"

    - name: Build with Coverage
      run: >
        cmake --build ${{ github.workspace }}/build
        --config Debug
        --parallel

    - name: Run Tests
      working-directory: ${{ github.workspace }}/build
      run: >
        ctest --output-on-failure
        -C Debug
        --parallel

    - name: Generate Coverage Report
      run: |
        cd build
        lcov --capture --directory . --output-file coverage.info
        lcov --remove coverage.info '/usr/*' --output-file coverage.info
        lcov --remove coverage.info '*/tests/*' --output-file coverage.info
        lcov --remove coverage.info '*/examples/*' --output-file coverage.info
        lcov --list coverage.info

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./build/coverage.info
        flags: unittests
        name: codecov-umbrella