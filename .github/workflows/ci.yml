name: CI Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]
        exclude:
          # Exclude Windows Debug to reduce CI time
          - os: windows-latest
            build_type: Debug

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Get date for cache
      id: get-date
      run: echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
      shell: bash

    - name: Cache vcpkg
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/vcpkg_installed
          ~/.vcpkg
        key: ${{ matrix.os }}-vcpkg-${{ steps.get-date.outputs.date }}
        restore-keys: |
          ${{ matrix.os }}-vcpkg-

    - name: Install and setup vcpkg (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        if [ ! -d "vcpkg" ]; then
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh
        else
          ./vcpkg/vcpkg version
        fi
      shell: bash

    - name: Install and setup vcpkg (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        if (-not (Test-Path "vcpkg")) {
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat
        } else {
          .\vcpkg\vcpkg version
        }
        echo "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      shell: powershell

    - name: Install dependencies (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        ./vcpkg/vcpkg install --triplet=x64-${{ matrix.os == 'macos-latest' && 'osx' || 'linux' }}
      shell: bash

    - name: Install dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        .\vcpkg\vcpkg.exe install --triplet=x64-windows
      shell: powershell

    - name: Install build tools (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ninja-build

    - name: Install build tools (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        # Install Xcode command line tools if not already installed
        xcode-select --install 2>/dev/null || true

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v1.14
      with:
        cmake-version: '3.20'

    - name: Configure CMake
      run: >
        cmake -B ${{ github.workspace }}/build
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
        -DVCPKG_TARGET_TRIPLET=x64-${{ matrix.os == 'windows-latest' && 'windows' || matrix.os == 'macos-latest' && 'osx' || 'linux' }}
        -DVCPKG_INSTALLED_DIR=${{ github.workspace }}/vcpkg_installed
        -DAPOLLO_BUILD_TESTS=ON
        -DAPOLLO_BUILD_EXAMPLES=OFF
        -G "${{ matrix.os == 'windows-latest' && 'Ninja Multi-Config' || 'Ninja' }}"

    - name: Build
      run: >
        cmake --build ${{ github.workspace }}/build
        --config ${{ matrix.build_type }}
        --parallel

    - name: Test
      working-directory: ${{ github.workspace }}/build
      run: >
        ctest --output-on-failure
        -C ${{ matrix.build_type }}
        --parallel

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.build_type }}
        path: build/Testing/**/*.xml

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.os }}-${{ matrix.build_type }}
        path: |
          build/lib/
          build/bin/
          build/*.a
          build/*.lib
        retention-days: 30

  coverage:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Get date for cache
      id: get-date
      run: echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

    - name: Cache vcpkg
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/vcpkg_installed
          ~/.vcpkg
        key: ubuntu-latest-vcpkg-${{ steps.get-date.outputs.date }}
        restore-keys: |
          ubuntu-latest-vcpkg-

    - name: Install and setup vcpkg
      run: |
        if [ ! -d "vcpkg" ]; then
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh
        else
          ./vcpkg/vcpkg version
        fi
      shell: bash

    - name: Install Coverage Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y lcov build-essential ninja-build

    - name: Install dependencies
      run: |
        ./vcpkg/vcpkg install --triplet=x64-linux
      shell: bash

    - name: Configure CMake with Coverage
      run: >
        cmake -B ${{ github.workspace }}/build
        -DCMAKE_BUILD_TYPE=Debug
        -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
        -DVCPKG_TARGET_TRIPLET=x64-linux
        -DVCPKG_INSTALLED_DIR=${{ github.workspace }}/vcpkg_installed
        -DAPOLLO_BUILD_TESTS=ON
        -DAPOLLO_ENABLE_COVERAGE=ON
        -DCMAKE_CXX_FLAGS="--coverage -g -O0"
        -DCMAKE_C_FLAGS="--coverage -g -O0"
        -G "Ninja"

    - name: Build with Coverage
      run: >
        cmake --build ${{ github.workspace }}/build
        --config Debug
        --parallel

    - name: Run Tests
      working-directory: ${{ github.workspace }}/build
      run: >
        ctest --output-on-failure
        -C Debug
        --parallel

    - name: Generate Coverage Report
      run: |
        cd build
        lcov --capture --directory . --output-file coverage.info --ignore-errors mismatch
        lcov --remove coverage.info '/usr/*' --output-file coverage.info
        lcov --remove coverage.info '*/tests/*' --output-file coverage.info
        lcov --remove coverage.info '*/examples/*' --output-file coverage.info
        lcov --remove coverage.info '*/vcpkg_installed/*' --output-file coverage.info
        lcov --remove coverage.info '*/_deps/*' --output-file coverage.info
        lcov --list coverage.info
        genhtml -o coverage-html coverage.info

    - name: Upload Coverage Artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-lcov
        path: build/coverage.info
        retention-days: 30

    - name: Upload Coverage HTML
      uses: actions/upload-artifact@v4
      with:
        name: coverage-html
        path: build/coverage-html
        retention-days: 30

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./build/coverage.info
        flags: unittests
        name: codecov-umbrella
        disable_search: true
        fail_ci_if_error: false
