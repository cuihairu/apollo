<text x="48" y="397" class="body" text-anchor="start">Input forward · Downlink bind</text>
</g>
<g data-node="login"><rect x="30" y="422" width="420" height="88" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
