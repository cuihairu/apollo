<g data-node="database"><rect x="30" y="1336" width="420" height="76" rx="12" fill="#edf5ff" stroke="#93b9e3" stroke-width="1.5"/>
<text x="48" y="1366" class="name" text-anchor="start">database</text>
<text x="48" y="1392" class="body" text-anchor="start">Persistent store · Journal tx · Write-epoch check</text>
</g>
