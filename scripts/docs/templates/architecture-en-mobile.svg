<text x="48" y="868" class="body" text-anchor="start">Register · Topology · Capacity · Migrate</text>
<text x="48" y="891" class="body" text-anchor="start">Allocation · Restart reconcile</text>
<text x="48" y="914" class="body" text-anchor="start">Durable management journal</text>
</g>
<g data-node="cellServer (executor)"><rect x="30" y="978" width="420" height="150" rx="12" fill="#eef8f5" stroke="#86c9b3" stroke-width="1.5"/>
<text x="48" y="1008" class="name" text-anchor="start">cellServer (executor)</text>
<text x="48" y="1034" class="body" text-anchor="start">Scene · Avatar · AOI · Battle · Lua</text>
<text x="48" y="1057" class="body" text-anchor="start">Standalone, multi-cell optional</text>
<text x="48" y="1080" class="body" text-anchor="start">Register 960 · Verdict 961 · Assign 962</text>
</g>
<g data-node="machined"><rect x="30" y="1144" width="420" height="80" rx="12" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="48" y="1174" class="name" text-anchor="start">machined</text>
<text x="48" y="1200" class="body" text-anchor="start">Spawn · Supervise · Reap process tree</text>
</g>
<g data-node="logger · admin"><rect x="30" y="1240" width="420" height="80" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
