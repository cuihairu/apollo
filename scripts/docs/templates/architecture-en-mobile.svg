<text x="48" y="478" class="body" text-anchor="start">Online directory · Auth · Admission</text>
<text x="48" y="501" class="body" text-anchor="start">Directory snapshot · Session resume</text>
</g>
<g data-node="interfaces"><rect x="30" y="526" width="420" height="88" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="48" y="556" class="name" text-anchor="start">interfaces</text>
<text x="48" y="582" class="body" text-anchor="start">Platform callback · Verify</text>
<text x="48" y="605" class="body" text-anchor="start">Dynamic Base · Idempotent delivery</text>
</g>
