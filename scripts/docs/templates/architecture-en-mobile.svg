<text x="370" y="1093" class="label" text-anchor="middle" style="fill:#c2410c">Supervise</text>
<path d="M390 1320 L390 962" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="control" marker-end="url(#arrow-slate)"/>
<text x="390" y="1141" class="label" text-anchor="middle" style="fill:#64748b">Log/metric</text>
<text x="24" y="1434" class="small" text-anchor="start">Dashed: control · Solid: business data</text>
<text x="24" y="1458" class="small" text-anchor="start">world is the manager; cellServer the standalone simulator; Base owns profiles, database persists</text>
