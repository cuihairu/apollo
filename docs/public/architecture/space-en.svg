<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Space, Cell, executor and Instance</title><desc id="desc">Initially each Space has one Cell; one executor hosts Cells from multiple Spaces. Future Cells of one Space may run in different executors. Instance associates with a gameplay Space.</desc>
<defs>
 <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#245bb2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#147565" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172b45}.sub{fill:#4c5d73}.blue{fill:#245bb2}.teal{fill:#147565}</style>
</defs><rect width="1280" height="700" fill="#fff"/>
<text x="28" y="40" font-size="27" font-weight="600" text-anchor="start">Runtime space, partition and gameplay boundaries</text>
<g data-node="world">
<rect x="467" y="65" width="346" height="83" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="485" y="98" font-size="23" font-weight="600" text-anchor="start">world</text>
<text x="485" y="125" font-size="17" font-weight="400" text-anchor="start" class="sub">Registry · topology · placement</text>
</g>
<text x="28" y="203" font-size="22" font-weight="600" text-anchor="start">Initial implementation target</text>
<text x="692" y="203" font-size="22" font-weight="600" text-anchor="start">Future extension · not implemented</text>
<rect x="28" y="235" width="560" height="220" rx="10" fill="#f8fafc" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="268" font-size="18" font-weight="600" text-anchor="start">cell process 1: Cells from several Spaces</text>
<g data-node="Cell A1">
<rect x="48" y="290" width="248" height="139" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="66" y="323" font-size="23" font-weight="600" text-anchor="start">Cell A1</text>
<text x="66" y="350" font-size="17" font-weight="400" text-anchor="start" class="sub">Space A</text>
<text x="66" y="373" font-size="17" font-weight="400" text-anchor="start" class="sub">Full-space partition</text>
</g>
<g data-node="Cell B1">
<rect x="320" y="290" width="248" height="139" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="338" y="323" font-size="23" font-weight="600" text-anchor="start">Cell B1</text>
<text x="338" y="350" font-size="17" font-weight="400" text-anchor="start" class="sub">Space B</text>
<text x="338" y="373" font-size="17" font-weight="400" text-anchor="start" class="sub">Full-space partition</text>
</g>
<path d="M540 148 L540 235" fill="none" stroke="#147565" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)" stroke-dasharray="7 6"/>
<path d="M740 148 L740 165 L1230 165 L1230 235" fill="none" stroke="#147565" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)" stroke-dasharray="7 6"/>
<g data-node="Instance X">
<rect x="48" y="501" width="248" height="78" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="66" y="534" font-size="21" font-weight="600" text-anchor="start">Instance X</text>
<text x="66" y="561" font-size="17" font-weight="400" text-anchor="start" class="sub">Activity in Space A</text>
</g>
<path d="M172 429 L172 501" fill="none" stroke="#147565" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)" stroke-dasharray="7 6"/>
<rect x="168.75" y="466" width="98.5" height="23" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="218" y="480" font-size="15" font-weight="500" text-anchor="middle" class="teal">Associates</text>
<text x="322" y="526" font-size="18" font-weight="600" text-anchor="start">Space B may persist</text>
<text x="322" y="554" font-size="17" font-weight="400" text-anchor="start" class="sub">No temporary Instance required</text>
<rect x="692" y="235" width="560" height="220" rx="10" fill="#f4f9f8" stroke="#ced8e5" stroke-width="1.3"/>
<text x="714" y="268" font-size="18" font-weight="600" text-anchor="start">Space A: one identity and coordinate system</text>
<g data-node="Cell A1">
<rect x="714" y="290" width="248" height="139" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="732" y="323" font-size="23" font-weight="600" text-anchor="start">Cell A1</text>
<text x="732" y="350" font-size="17" font-weight="400" text-anchor="start" class="sub">Runs in cell process 1</text>
<text x="732" y="373" font-size="17" font-weight="400" text-anchor="start" class="sub">Real entities</text>
</g>
<g data-node="Cell A2">
<rect x="984" y="290" width="248" height="139" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="1002" y="323" font-size="23" font-weight="600" text-anchor="start">Cell A2</text>
<text x="1002" y="350" font-size="17" font-weight="400" text-anchor="start" class="sub">Runs in cell process 2</text>
<text x="1002" y="373" font-size="17" font-weight="400" text-anchor="start" class="sub">Real entities</text>
</g>
<path d="M962 359 L984 359" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<text x="714" y="518" font-size="17" font-weight="400" text-anchor="start" class="sub">Hand off authority; preserve entity ID and coordinates.</text>
<text x="714" y="550" font-size="17" font-weight="400" text-anchor="start" class="sub">Ghosts, continuous views and boundary combat are deferred.</text>
<rect x="28" y="614" width="1224" height="62" rx="10" fill="#f8fafc" stroke="none" stroke-width="1.3"/>
<text x="48" y="640" font-size="18" font-weight="600" text-anchor="start">Space matches current Scene semantics; Cell is a partition, cell is a process.</text>
<text x="48" y="665" font-size="17" font-weight="400" text-anchor="start" class="sub">Instance owns gameplay lifecycle; do not add synonymous Scene → Space containers.</text>
</svg>
