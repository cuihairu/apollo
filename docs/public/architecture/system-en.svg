<text x="1118" y="37" font-size="16" font-weight="400" text-anchor="start" class="sub">Control</text>
<text x="28" y="75" font-size="17" font-weight="400" text-anchor="start" class="sub">Base ↔ database: standalone prototypes. World/cell split landed (--role=cell); gateway dials world.</text>
<rect x="28" y="106" width="1224" height="178" rx="10" fill="#f4f9f8" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="134" font-size="17" font-weight="600" text-anchor="start" class="teal">Authentication, directories and placement</text>
<g data-node="login">
