<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1510" viewBox="0 0 480 1510" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">Apollo 外部 HTTP 回调与开发工具边界</title><desc id="desc">目标设计，尚未实现。interfaces 可靠接收通知，按稳定玩家身份查询当前 Base，Base 经 database 幂等发货。脚手架与 CI 属于开发工具，不是在线业务进程。</desc>
<defs>
 <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#245bb2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#147565" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172b45}.sub{fill:#4c5d73}.blue{fill:#245bb2}.teal{fill:#147565}</style>
</defs><rect width="480" height="1510" fill="#fff"/>
<text x="24" y="38" font-size="25" font-weight="600" text-anchor="start">外部 HTTP 回调</text>
<text x="24" y="72" font-size="18" font-weight="400" text-anchor="start" class="sub">interfaces / 订单事务：待实现</text>
<g data-node="外部支付 / 渠道平台">
<rect x="30" y="109" width="420" height="96" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="142" font-size="21" font-weight="600" text-anchor="start">外部支付 / 渠道平台</text>
<text x="48" y="169" font-size="18" font-weight="400" text-anchor="start" class="sub">HTTP 服务端通知</text>
</g>
<g data-node="interfaces">
<rect x="30" y="262" width="420" height="114" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="295" font-size="23" font-weight="600" text-anchor="start">interfaces</text>
<text x="48" y="322" font-size="18" font-weight="400" text-anchor="start" class="sub">HTTPS 验签 · 可靠受理 · 异步投递</text>
<text x="48" y="345" font-size="18" font-weight="400" text-anchor="start" class="sub">按稳定玩家身份处理订单</text>
</g>
<path d="M240 205 L240 262" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<rect x="255.25" y="225" width="65.5" height="26" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="288" y="242" font-size="18" font-weight="500" text-anchor="middle" class="blue">HTTPS</text>
<g data-node="login：服务 / 归属目录">
<rect x="30" y="454" width="420" height="110" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="487" font-size="22" font-weight="600" text-anchor="start">login：服务 / 归属目录</text>
<text x="48" y="514" font-size="18" font-weight="400" text-anchor="start" class="sub">玩家 → 当前 Base + 归属代次</text>
</g>
<path d="M130 376 L130 454" fill="none" stroke="#147565" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)" marker-start="url(#teal)" stroke-dasharray="7 6"/>
<rect x="137.575" y="404" width="220.85000000000002" height="25" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="248" y="420" font-size="18" font-weight="500" text-anchor="middle" class="teal">interfaces 查询当前归属</text>
<g data-node="base：当前承载进程">
<rect x="30" y="680" width="420" height="133" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="713" font-size="22" font-weight="600" text-anchor="start">base：当前承载进程</text>
<text x="48" y="740" font-size="18" font-weight="400" text-anchor="start" class="sub">离线激活 · 校验订单 · 幂等发货</text>
<text x="48" y="763" font-size="18" font-weight="400" text-anchor="start" class="sub">迁移后旧写入者必须被隔离</text>
</g>
<path d="M30 320 L10 320 L10 746 L30 746" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="42" y="620" font-size="18" font-weight="600" text-anchor="start">interfaces 按玩家身份投递到当前 Base</text>
<g data-node="database">
<rect x="30" y="925" width="420" height="133" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="958" font-size="23" font-weight="600" text-anchor="start">database</text>
<text x="48" y="985" font-size="18" font-weight="400" text-anchor="start" class="sub">通知 / 待办可靠保存</text>
<text x="48" y="1008" font-size="18" font-weight="400" text-anchor="start" class="sub">奖励与去重凭据原子提交</text>
<text x="48" y="1031" font-size="18" font-weight="400" text-anchor="start" class="sub">事务接口待实现</text>
</g>
<path d="M330 376 L468 376 L468 960 L450 960" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M240 813 L240 925" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<rect x="157.625" y="862" width="164.75" height="25" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="240" y="878" font-size="18" font-weight="500" text-anchor="middle" class="blue">Base 提交业务结果</text>
<text x="30" y="1110" font-size="18" font-weight="600" text-anchor="start">确认收到 ≠ 发货完成；不可达则保留待办。</text>
<text x="30" y="1145" font-size="18" font-weight="400" text-anchor="start" class="sub">world / cell 不处理支付发货。</text>
<rect x="24" y="1200" width="432" height="280" rx="10" fill="#f8fafc" stroke="#ced8e5" stroke-width="1.3"/>
<text x="42" y="1236" font-size="21" font-weight="600" text-anchor="start">开发与交付工具</text>
<text x="42" y="1280" font-size="20" font-weight="600" text-anchor="start">项目初始化 CLI：init（待实现）</text>
<text x="42" y="1318" font-size="18" font-weight="400" text-anchor="start" class="sub">生成配置、Lua 与启停 / CI 模板</text>
<text x="42" y="1372" font-size="20" font-weight="600" text-anchor="start">CI workflow 在仓库执行</text>
<text x="42" y="1410" font-size="18" font-weight="400" text-anchor="start" class="sub">构建、测试、契约和文档检查</text>
<text x="42" y="1450" font-size="18" font-weight="400" text-anchor="start" class="sub">不属于在线业务处理链路。</text>
</svg>
