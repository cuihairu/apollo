<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1440" viewBox="0 0 480 1440" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Apollo target processes and communication</title><desc id="desc">Solid lines carry business requests/results; dashed lines carry registration and management. Base owns profiles, cell owns simulation, World manages placement, machined supervises locally.</desc>
<defs>
 <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#245bb2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#147565" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172b45}.sub{fill:#4c5d73}.blue{fill:#245bb2}.teal{fill:#147565}</style>
</defs><rect width="480" height="1440" fill="#fff"/>
<text x="24" y="37" font-size="24" font-weight="600" text-anchor="start">Target process topology</text>
<text x="24" y="67" font-size="18" font-weight="400" text-anchor="start" class="sub">Base ↔ database: standalone prototypes</text>
<text x="24" y="92" font-size="18" font-weight="400" text-anchor="start" class="sub">World/cell split landed (--role=cell)</text>
<text x="30" y="133" font-size="18" font-weight="600" text-anchor="start" class="teal">Authentication and placement</text>
<g data-node="login">
<rect x="30" y="155" width="420" height="94" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="188" font-size="23" font-weight="600" text-anchor="start">login</text>
<text x="48" y="215" font-size="18" font-weight="400" text-anchor="start" class="sub">Auth · services · online directory</text>
</g>
<g data-node="world">
<rect x="30" y="291" width="420" height="102" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="324" font-size="23" font-weight="600" text-anchor="start">world</text>
<text x="48" y="351" font-size="18" font-weight="400" text-anchor="start" class="sub">cell registry · Space/Cell placement</text>
<text x="48" y="379" font-size="18" font-weight="500" text-anchor="start" class="sub">Embeds cell execution + places standalone cells</text>
</g>
<path d="M240 291 L240 249" fill="none" stroke="#147565" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)" stroke-dasharray="7 6"/>
<rect x="64.79999999999998" y="261" width="350.40000000000003" height="24" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="240" y="276" font-size="18" font-weight="500" text-anchor="middle" class="teal">Service registry (964/965)</text>
<text x="30" y="421" font-size="18" font-weight="400" text-anchor="start" class="sub">cell registers with World for placement.</text>
<text x="30" y="445" font-size="18" font-weight="400" text-anchor="start" class="sub">Client authenticates via gateway; login not client-facing.</text>
<g data-node="Client">
<rect x="30" y="464" width="420" height="80" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="497" font-size="23" font-weight="600" text-anchor="start">Client</text>
<text x="48" y="524" font-size="18" font-weight="400" text-anchor="start" class="sub">Game client</text>
</g>
<g data-node="gateway">
<rect x="30" y="594" width="420" height="96" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="627" font-size="23" font-weight="600" text-anchor="start">gateway</text>
<text x="48" y="654" font-size="18" font-weight="400" text-anchor="start" class="sub">Own sockets · cache Base / cell routes</text>
</g>
<path d="M240 544 L240 594" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<rect x="225.575" y="559" width="118.85000000000002" height="25" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="285" y="575" font-size="18" font-weight="500" text-anchor="middle" class="blue">TCP / WS(S)</text>
<path d="M30 641 L16 641 L16 202 L30 202" fill="none" stroke="#147565" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)" marker-start="url(#teal)" stroke-dasharray="7 6"/>
<g data-node="base">
<rect x="30" y="806" width="190" height="112" rx="10" fill="#f0f5fe" stroke="#9bb5dc" stroke-width="1.3"/>
<text x="48" y="839" font-size="21" font-weight="600" text-anchor="start">base</text>
<text x="48" y="866" font-size="18" font-weight="400" text-anchor="start" class="sub">Avatar · Base</text>
<text x="48" y="889" font-size="18" font-weight="400" text-anchor="start" class="sub">Persistent profile</text>
</g>
<g data-node="cell executor">
<rect x="260" y="806" width="190" height="112" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="278" y="839" font-size="21" font-weight="600" text-anchor="start">cell executor</text>
<text x="278" y="866" font-size="18" font-weight="400" text-anchor="start" class="sub">Avatar / Entity</text>
<text x="278" y="889" font-size="18" font-weight="400" text-anchor="start" class="sub">AOI · combat</text>
</g>
<path d="M240 690 L240 738 L125 738 L125 806" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M240 738 L355 738 L355 806" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="56.224999999999994" y="764" width="137.55" height="25" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="125" y="780" font-size="18" font-weight="500" text-anchor="middle" class="blue">Base gameplay</text>
<rect x="290.9" y="764" width="128.20000000000002" height="25" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="355" y="780" font-size="18" font-weight="500" text-anchor="middle" class="blue">Input / sync</text>
<path d="M260 862 L220 862" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="260" y="954" font-size="18" font-weight="400" text-anchor="start" class="sub">Snapshots pulled on demand (935/936), not pushed</text>
<text x="260" y="985" font-size="18" font-weight="400" text-anchor="start" class="sub">cell → Base: settlement (958/959)</text>
<path d="M450 339 L464 339 L464 862 L450 862" fill="none" stroke="#147565" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)" marker-start="url(#teal)" stroke-dasharray="7 6"/>
<g data-node="database">
<rect x="30" y="1022" width="190" height="104" rx="10" fill="#f0f5fe" stroke="#9bb5dc" stroke-width="1.3"/>
<text x="48" y="1055" font-size="21" font-weight="600" text-anchor="start">database</text>
<text x="48" y="1082" font-size="18" font-weight="400" text-anchor="start" class="sub">Load / save</text>
<text x="48" y="1105" font-size="18" font-weight="400" text-anchor="start" class="sub">journal</text>
</g>
<path d="M125 918 L125 1022" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<rect x="65.57499999999999" y="976" width="118.85000000000002" height="25" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="125" y="992" font-size="18" font-weight="500" text-anchor="middle" class="blue">Load / save</text>
<path d="M30 1205 A95.0 13 0 0 1 220 1205 V1266 A95.0 13 0 0 1 30 1266 Z" fill="#f5f7fa" stroke="#ced8e5" stroke-width="1.3"/>
<ellipse cx="125.0" cy="1205" rx="95.0" ry="13" fill="#eef2f7" stroke="#ced8e5" stroke-width="1.3"/>
<text x="125.0" y="1234" font-size="20" font-weight="600" text-anchor="middle">Storage</text>
<text x="125.0" y="1258" font-size="18" font-weight="400" text-anchor="middle" class="sub">Files / database</text>
<path d="M125 1126 L125 1192" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<rect x="129.6" y="1152" width="112.80000000000001" height="24" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="186" y="1167" font-size="18" font-weight="500" text-anchor="middle" class="blue">Storage I/O</text>
<text x="260" y="1050" font-size="18" font-weight="400" text-anchor="start" class="sub">Solid: business / results</text>
<text x="260" y="1081" font-size="18" font-weight="400" text-anchor="start" class="sub">Dashed: registration</text>
<text x="260" y="1112" font-size="18" font-weight="400" text-anchor="start" class="sub">cell executor landed (--role=cell)</text>
<g data-node="machined">
<rect x="30" y="1320" width="420" height="92" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="1353" font-size="23" font-weight="600" text-anchor="start">machined</text>
<text x="48" y="1380" font-size="18" font-weight="400" text-anchor="start" class="sub">Optional per host; local supervision only</text>
</g>
</svg>
