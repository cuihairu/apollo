<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">Space、Cell、执行进程与 Instance</title><desc id="desc">默认每 Space 一个 Cell，一个执行进程承载多个空间的 Cell；未来同一 Space 可分配多个 Cell 到不同执行进程。Instance 只关联玩法空间。</desc>
<defs>
 <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#245bb2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#147565" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172b45}.sub{fill:#4c5d73}.blue{fill:#245bb2}.teal{fill:#147565}</style>
</defs><rect width="1280" height="700" fill="#fff"/>
<text x="28" y="40" font-size="27" font-weight="600" text-anchor="start">运行空间、分区与玩法的边界</text>
<g data-node="world">
<rect x="467" y="65" width="346" height="83" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="485" y="98" font-size="23" font-weight="600" text-anchor="start">world</text>
<text x="485" y="125" font-size="17" font-weight="400" text-anchor="start" class="sub">管理注册、Space/Cell 拓扑与分配</text>
</g>
<text x="28" y="203" font-size="22" font-weight="600" text-anchor="start">默认基础路径 · 实施目标</text>
<text x="692" y="203" font-size="22" font-weight="600" text-anchor="start">未来扩展 · 尚未实现</text>
<rect x="28" y="235" width="560" height="220" rx="10" fill="#f8fafc" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="268" font-size="18" font-weight="600" text-anchor="start">cell 进程 1：承载多个 Space 的 Cell</text>
<g data-node="Cell A1">
<rect x="48" y="290" width="248" height="139" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="66" y="323" font-size="23" font-weight="600" text-anchor="start">Cell A1</text>
<text x="66" y="350" font-size="17" font-weight="400" text-anchor="start" class="sub">Space A</text>
<text x="66" y="373" font-size="17" font-weight="400" text-anchor="start" class="sub">覆盖该空间全范围</text>
</g>
<g data-node="Cell B1">
<rect x="320" y="290" width="248" height="139" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="338" y="323" font-size="23" font-weight="600" text-anchor="start">Cell B1</text>
<text x="338" y="350" font-size="17" font-weight="400" text-anchor="start" class="sub">Space B</text>
<text x="338" y="373" font-size="17" font-weight="400" text-anchor="start" class="sub">覆盖该空间全范围</text>
</g>
<path d="M540 148 L540 235" fill="none" stroke="#147565" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)" stroke-dasharray="7 6"/>
<path d="M740 148 L740 165 L1230 165 L1230 235" fill="none" stroke="#147565" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)" stroke-dasharray="7 6"/>
<g data-node="Instance X">
<rect x="48" y="501" width="248" height="78" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="66" y="534" font-size="21" font-weight="600" text-anchor="start">Instance X</text>
<text x="66" y="561" font-size="17" font-weight="400" text-anchor="start" class="sub">玩法关联 Space A</text>
</g>
<path d="M172 429 L172 501" fill="none" stroke="#147565" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)" stroke-dasharray="7 6"/>
<rect x="195.0" y="466" width="46" height="23" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="218" y="480" font-size="15" font-weight="500" text-anchor="middle" class="teal">关联</text>
<text x="322" y="526" font-size="18" font-weight="600" text-anchor="start">Space B 可持续存在</text>
<text x="322" y="554" font-size="17" font-weight="400" text-anchor="start" class="sub">无需临时 Instance</text>
<rect x="692" y="235" width="560" height="220" rx="10" fill="#f4f9f8" stroke="#ced8e5" stroke-width="1.3"/>
<text x="714" y="268" font-size="18" font-weight="600" text-anchor="start">Space A：同一空间 ID 与坐标体系</text>
<g data-node="Cell A1">
<rect x="714" y="290" width="248" height="139" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="732" y="323" font-size="23" font-weight="600" text-anchor="start">Cell A1</text>
<text x="732" y="350" font-size="17" font-weight="400" text-anchor="start" class="sub">cell 进程 1 执行</text>
<text x="732" y="373" font-size="17" font-weight="400" text-anchor="start" class="sub">本分区权威实体</text>
</g>
<g data-node="Cell A2">
<rect x="984" y="290" width="248" height="139" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="1002" y="323" font-size="23" font-weight="600" text-anchor="start">Cell A2</text>
<text x="1002" y="350" font-size="17" font-weight="400" text-anchor="start" class="sub">cell 进程 2 执行</text>
<text x="1002" y="373" font-size="17" font-weight="400" text-anchor="start" class="sub">本分区权威实体</text>
</g>
<path d="M962 359 L984 359" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<text x="714" y="518" font-size="17" font-weight="400" text-anchor="start" class="sub">跨分区交接模拟权威，保留实体 ID 与坐标。</text>
<text x="714" y="550" font-size="17" font-weight="400" text-anchor="start" class="sub">Ghost、连续可见性与跨边界战斗另行实现。</text>
<rect x="28" y="614" width="1224" height="62" rx="10" fill="#f8fafc" stroke="none" stroke-width="1.3"/>
<text x="48" y="640" font-size="18" font-weight="600" text-anchor="start">Space 对应现有 Scene 的空间语义；Cell 是分区，cell 是进程。</text>
<text x="48" y="665" font-size="17" font-weight="400" text-anchor="start" class="sub">Instance 管玩法生命周期，不叠加为 Scene → Space 同义容器。</text>
</svg>
