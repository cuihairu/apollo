<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">Apollo 目标进程与通信</title><desc id="desc">实线表示业务请求与结果，虚线表示注册和管理。Base 管长期资料，cell 管模拟；world 管理分配，machined 只监督本机。</desc>
<defs>
 <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#245bb2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#147565" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172b45}.sub{fill:#4c5d73}.blue{fill:#245bb2}.teal{fill:#147565}</style>
</defs><rect width="1280" height="840" fill="#fff"/>
<text x="28" y="40" font-size="27" font-weight="600" text-anchor="start">目标进程与通信</text>
<path d="M820 31 L866 31" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="878" y="37" font-size="16" font-weight="400" text-anchor="start" class="sub">业务请求 / 结果</text>
<path d="M1060 31 L1106 31" fill="none" stroke="#147565" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)" stroke-dasharray="7 6"/>
<text x="1118" y="37" font-size="16" font-weight="400" text-anchor="start" class="sub">注册 / 管理</text>
<text x="28" y="75" font-size="17" font-weight="400" text-anchor="start" class="sub">独立原型：Base ↔ database；World/cell 拆分已落地（cellServer 独立入口），gateway 对接 world。</text>
<rect x="28" y="106" width="1224" height="178" rx="10" fill="#f4f9f8" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="134" font-size="17" font-weight="600" text-anchor="start" class="teal">认证、目录与空间管理</text>
<g data-node="login">
<rect x="300" y="154" width="270" height="104" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="318" y="187" font-size="23" font-weight="600" text-anchor="start">login</text>
<text x="318" y="214" font-size="17" font-weight="400" text-anchor="start" class="sub">认证 · 服务 / 在线目录</text>
</g>
<g data-node="world">
<rect x="760" y="154" width="320" height="104" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="778" y="187" font-size="23" font-weight="600" text-anchor="start">world</text>
<text x="778" y="214" font-size="17" font-weight="400" text-anchor="start" class="sub">Space/Cell 分配 · 拓扑 · 排空</text>
<text x="778" y="244" font-size="14" font-weight="500" text-anchor="start" class="sub">内嵌 cell 执行 + 独立 cell 分配</text>
</g>
<path d="M760 207 L570 207" fill="none" stroke="#147565" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)" stroke-dasharray="7 6"/>
<rect x="599.625" y="177" width="130.75" height="23" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="665" y="191" font-size="15" font-weight="500" text-anchor="middle" class="teal">服务注册（964/965）</text>
<rect x="28" y="330" width="1224" height="356" rx="10" fill="#f8fafc" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="358" font-size="17" font-weight="600" text-anchor="start">连接、业务与模拟</text>
<g data-node="客户端">
<rect x="48" y="386" width="160" height="96" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="66" y="419" font-size="22" font-weight="600" text-anchor="start">客户端</text>
<text x="66" y="446" font-size="17" font-weight="400" text-anchor="start" class="sub">游戏连接</text>
</g>
<g data-node="gateway">
<rect x="278" y="386" width="220" height="96" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="296" y="419" font-size="23" font-weight="600" text-anchor="start">gateway</text>
<text x="296" y="446" font-size="17" font-weight="400" text-anchor="start" class="sub">socket · 会话 · 转发</text>
</g>
<g data-node="base">
<rect x="615" y="386" width="250" height="96" rx="10" fill="#f0f5fe" stroke="#9bb5dc" stroke-width="1.3"/>
<text x="633" y="419" font-size="23" font-weight="600" text-anchor="start">base</text>
<text x="633" y="446" font-size="17" font-weight="400" text-anchor="start" class="sub">Avatar · Base 部分</text>
<text x="633" y="468" font-size="14" font-weight="500" text-anchor="start" class="blue">独立原型</text>
</g>
<g data-node="database">
<rect x="966" y="386" width="250" height="96" rx="10" fill="#f0f5fe" stroke="#9bb5dc" stroke-width="1.3"/>
<text x="984" y="419" font-size="23" font-weight="600" text-anchor="start">database</text>
<text x="984" y="446" font-size="17" font-weight="400" text-anchor="start" class="sub">加载 / 保存 · journal</text>
<text x="984" y="468" font-size="14" font-weight="500" text-anchor="start" class="blue">独立原型</text>
</g>
<g data-node="cell 执行进程">
<rect x="580" y="558" width="330" height="112" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="598" y="591" font-size="23" font-weight="600" text-anchor="start">cell 执行进程</text>
<text x="598" y="618" font-size="17" font-weight="400" text-anchor="start" class="sub">Avatar/Entity · AOI · 战斗</text>
<text x="598" y="656" font-size="14" font-weight="500" text-anchor="start" class="sub">world 管理端 + cellServer</text>
</g>
<path d="M1001 571 A90.0 13 0 0 1 1181 571 V632 A90.0 13 0 0 1 1001 632 Z" fill="#f5f7fa" stroke="#ced8e5" stroke-width="1.3"/>
<ellipse cx="1091.0" cy="571" rx="90.0" ry="13" fill="#eef2f7" stroke="#ced8e5" stroke-width="1.3"/>
<text x="1091.0" y="600" font-size="20" font-weight="600" text-anchor="middle">实际存储</text>
<text x="1091.0" y="624" font-size="16" font-weight="400" text-anchor="middle" class="sub">文件 / 数据库</text>
<path d="M208 434 L278 434" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<rect x="177.25" y="360" width="131.5" height="23" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="243" y="374" font-size="15" font-weight="500" text-anchor="middle" class="blue">TCP / WS / WSS</text>
<path d="M498 434 L615 434" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<rect x="518.0" y="405" width="76" height="23" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="556" y="419" font-size="15" font-weight="500" text-anchor="middle" class="blue">基础业务</text>
<path d="M865 434 L966 434" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<rect x="864.625" y="405" width="100.75" height="23" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="915" y="419" font-size="15" font-weight="500" text-anchor="middle" class="blue">加载 / 保存</text>
<path d="M388 482 L388 614 L580 614" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<rect x="407.8" y="583" width="138.4" height="24" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="477" y="598" font-size="16" font-weight="500" text-anchor="middle" class="blue">场景输入 / 同步</text>
<path d="M745 482 L745 558" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="680" y="511" width="130" height="24" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="745" y="526" font-size="16" font-weight="500" text-anchor="middle" class="blue">结算（958/959）</text>
<path d="M1091 482 L1091 558" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<rect x="1102.5" y="513" width="79.0" height="23" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="1142" y="527" font-size="15" font-weight="500" text-anchor="middle" class="blue">存储 I/O</text>
<path d="M378 386 L378 258" fill="none" stroke="#147565" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)" marker-start="url(#teal)" stroke-dasharray="7 6"/>
<rect x="336" y="299" width="150" height="23" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="411" y="313" font-size="15" font-weight="500" text-anchor="middle" class="teal">路由解析 / 会话校验</text>
<path d="M650 386 L650 303 L520 303 L520 258" fill="none" stroke="#147565" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)" stroke-dasharray="7 6"/>
<rect x="540.375" y="281" width="87.25" height="23" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="584" y="295" font-size="15" font-weight="500" text-anchor="middle" class="teal">Base 注册</text>
<path d="M1080 207 L1232 207 L1232 712 L745 712 L745 670" fill="none" stroke="#147565" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)" marker-start="url(#teal)" stroke-dasharray="7 6"/>
<rect x="905.6" y="689" width="208.8" height="24" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="1010" y="704" font-size="16" font-weight="500" text-anchor="middle" class="teal">cell 注册 / 分配 / 排空</text>
<g data-node="machined">
<rect x="48" y="748" width="1168" height="64" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="66" y="781" font-size="21" font-weight="600" text-anchor="start">machined</text>
</g>
<text x="210" y="786" font-size="17" font-weight="400" text-anchor="start" class="sub">按机器可选部署，只拉起 / 监督本机进程；不裁决玩家归属或空间分配。</text>
</svg>
