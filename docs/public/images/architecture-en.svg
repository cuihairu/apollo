<text x="40" y="1800" class="small" text-anchor="start">Dashed: control · Solid: business data · Crossings without a dot are not connected</text>
<text x="40" y="1825" class="small" text-anchor="start">world is the manager; cellServer is the standalone simulator; Base holds long-term profiles, database persists; principal process relations shown</text>
<text x="40" y="1850" class="small">Unverified capabilities are shown as "still in progress" and are not a claim of acceptance.</text>
</svg>
