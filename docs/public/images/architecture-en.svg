<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1915" viewBox="0 0 1280 1915" role="img" aria-labelledby="title desc" xml:lang="en-US">
<title id="title">Apollo · Process Architecture</title>
<desc id="desc">A lightweight instance-based game server engine. Clients connect via Gateway; Login handles authentication and the online directory; World is the manager and cellServer is the standalone simulation executor, coordinated over 960 register / 961 verdict / 962 assign / 963 retire / 967 self-report; Base owns player profiles and base gameplay and persists through database; interfaces receives platform callbacks; machined spawns and supervises each process; logger/admin collect logs and metrics. Dashed lines are control, solid lines are business data. The diagram is a target contract, not a claim that everything is implemented.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172b4d}.title{font-size:30px;font-weight:700}.name{font-size:23px;font-weight:700}.body{font-size:17px;fill:#435570}.small{font-size:15px;fill:#52647b}.label{font-size:15px;fill:#435570;paint-order:stroke;stroke:#f8fafc;stroke-width:5px;stroke-linejoin:round}.edge{fill:none;stroke-linejoin:round}.control{stroke-dasharray:7 5}</style>
<rect width="1280" height="1915" rx="20" fill="#f8fafc"/>
<text x="40" y="48" class="title" text-anchor="start">Apollo · Process Architecture</text>
<text x="40" y="80" class="body" text-anchor="start">Lightweight instance-based game server · manager/executor split · single-realm closed loop, still in progress</text>

