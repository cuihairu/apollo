<text x="840" y="1098" class="label" text-anchor="middle" style="fill:#6366f1">960 register · 961 verdict · 962 assign · 963 retire · 967 self-report</text>
<text transform="translate(850 980) rotate(-90)" class="label" style="fill:#2563eb">Simulation input direct</text>
<text x="560" y="1432" class="label" text-anchor="start" style="fill:#7c3aed">Settlement to Base 9201</text>
<text x="452" y="1470" class="label" text-anchor="start" style="fill:#7c3aed">Player data 9200</text>
<text x="355" y="1465" class="label" text-anchor="start" style="fill:#c2410c">Supervise / spawn</text>
