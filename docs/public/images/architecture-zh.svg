<g id="client" data-node="client"><rect x="60" y="130" width="300" height="100" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="80" y="164" class="name" text-anchor="start">游戏客户端</text>
<text x="80" y="195" class="body" text-anchor="start">登录 · 输入 · 状态</text>
</g>
<g id="gm-cli" data-node="gm-cli"><rect x="440" y="130" width="300" height="100" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="460" y="164" class="name" text-anchor="start">运维 / 管理 CLI</text>
<text x="460" y="195" class="body" text-anchor="start">fleetctl · apolloc · 管理命令</text>
</g>
<g id="platform" data-node="platform"><rect x="900" y="130" width="300" height="100" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="920" y="164" class="name" text-anchor="start">平台 / 渠道</text>
<text x="920" y="195" class="body" text-anchor="start">回调 · 支付发货</text>
</g>

<g id="gateway" data-node="gateway"><rect x="60" y="340" width="300" height="130" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="80" y="374" class="name" text-anchor="start">gateway</text>
<text x="80" y="405" class="body" text-anchor="start">客户端 TCP · 会话绑定</text>
<text x="80" y="432" class="body" text-anchor="start">输入转发 · 下行绑定</text>
</g>
<g id="login" data-node="login"><rect x="440" y="340" width="300" height="130" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="460" y="374" class="name" text-anchor="start">login</text>
<text x="460" y="405" class="body" text-anchor="start">在线目录 · 认证 · 准入</text>
<text x="460" y="432" class="body" text-anchor="start">目录快照 · 会话恢复</text>
</g>
<g id="interfaces" data-node="interfaces"><rect x="900" y="340" width="300" height="130" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="920" y="374" class="name" text-anchor="start">interfaces</text>
<text x="920" y="405" class="body" text-anchor="start">平台回调 · 验签</text>
<text x="920" y="432" class="body" text-anchor="start">动态 Base 解析 · 幂等发货</text>
</g>

<g id="base" data-node="base"><rect x="60" y="1030" width="360" height="370" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="80" y="1064" class="name" text-anchor="start">base</text>
<text x="80" y="1095" class="body" text-anchor="start">玩家档案与基础业务</text>
<text x="80" y="1122" class="body" text-anchor="start">资料写权 · 长期对象</text>
<text x="80" y="1149" class="body" text-anchor="start">待办 · 会话</text>
<text x="80" y="1176" class="body" text-anchor="start">结算确认</text>
<text x="80" y="1203" class="small" text-anchor="start">玩家归属不变，承载可变</text>
</g>
<g id="world" data-node="world"><rect x="460" y="1030" width="360" height="370" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="480" y="1064" class="name" text-anchor="start">world（管理端）</text>
<text x="480" y="1095" class="body" text-anchor="start">注册 · 拓扑 · 容量 · 迁移</text>
<text x="480" y="1122" class="body" text-anchor="start">分配决定 · 重启对账</text>
<text x="480" y="1149" class="body" text-anchor="start">持久管理日志</text>
<text x="480" y="1176" class="small" text-anchor="start">一个 Space 一个 Cell</text>
<text x="480" y="1203" class="small" text-anchor="start">已有活动不自动搬迁</text>
</g>
<g id="cell" data-node="cell"><rect x="860" y="1030" width="380" height="370" rx="14" fill="#eef8f5" stroke="#86c9b3" stroke-width="1.5"/>
<text x="880" y="1064" class="name" text-anchor="start">cellServer（执行端）</text>
<text x="880" y="1095" class="body" text-anchor="start">Scene · Avatar · AOI</text>
<text x="880" y="1122" class="body" text-anchor="start">战斗 · Lua 脚本</text>
<text x="880" y="1149" class="small" text-anchor="start">独立进程，多 cell 可选</text>
<text x="880" y="1176" class="small" text-anchor="start">注册 960 · 裁决 961</text>
<text x="880" y="1203" class="small" text-anchor="start">分配 962 · 自报 967</text>
</g>

<g id="machined" data-node="machined"><rect x="60" y="1480" width="560" height="120" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="80" y="1514" class="name" text-anchor="start">machined</text>
<text x="80" y="1545" class="body" text-anchor="start">拉起 · 监督 · 进程树回收</text>
<text x="80" y="1572" class="small" text-anchor="start">监督范围：gateway · login · base · world · cell · database · interfaces · logger · admin</text>
</g>
<g id="logger-admin" data-node="logger-admin"><rect x="660" y="1480" width="560" height="120" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
<text x="680" y="1514" class="name" text-anchor="start">logger · admin</text>
<text x="680" y="1545" class="body" text-anchor="start">日志 9102 · 指标 9106 / 9107</text>
<text x="680" y="1572" class="small" text-anchor="start">各进程日志推送 · 指标采样流（断连降级即常态路径）</text>
</g>

<g id="database" data-node="database"><rect x="200" y="1680" width="880" height="80" rx="14" fill="#edf5ff" stroke="#93b9e3" stroke-width="1.5"/>
<text x="220" y="1714" class="name" text-anchor="start">database</text>
<text x="220" y="1745" class="body" text-anchor="start">持久存储 · 玩家数据 · journal 事务 · 写权校验</text>
</g>

<text x="218" y="300" class="label" text-anchor="start" style="fill:#2563eb">TCP 9002</text>
<text x="1042" y="300" class="label" text-anchor="end" style="fill:#087f5b">HTTPS</text>
<text x="455" y="278" class="label" text-anchor="start" style="fill:#c2410c">管理 CLI / Admin</text>
<text x="400" y="396" class="label" text-anchor="middle">会话 / 目录 900-908</text>
<text x="218" y="760" class="label" text-anchor="start" style="fill:#2563eb">基础业务前递</text>
<text transform="translate(428 940) rotate(-90)" class="label">M1 9101</text>
<text transform="translate(417 980) rotate(-90)" class="label" style="fill:#7c3aed">资料 9201</text>
<text x="598" y="760" class="label" text-anchor="start">准入 / 分配 915-916</text>
<text x="840" y="1098" class="label" text-anchor="middle" style="fill:#6366f1">960 注册 · 961 裁决 · 962 分配 · 963 retire · 967 自报</text>
<text transform="translate(850 980) rotate(-90)" class="label" style="fill:#2563eb">模拟输入直达</text>
<text x="560" y="1432" class="label" text-anchor="start" style="fill:#7c3aed">结算 拨 Base 9201</text>
<text x="452" y="1470" class="label" text-anchor="start" style="fill:#7c3aed">玩家数据 9200</text>
<text x="355" y="1465" class="label" text-anchor="start" style="fill:#c2410c">监督 / 拉起</text>
<text x="955" y="1462" class="label" text-anchor="start">日志 / 指标推送</text>

<text x="40" y="1800" class="small" text-anchor="start">虚线：控制关系 · 实线：业务数据 · 无圆点的交叉不表示连通</text>
<text x="40" y="1825" class="small" text-anchor="start">world 为管理端，cellServer 为独立模拟执行端；Base 管长期资料，database 持久；图示主要进程关系</text>
<text x="40" y="1850" class="small">未经验证的能力以「持续实现中」呈现，不代表已全部验收。</text>
</svg>
