<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1915" viewBox="0 0 1280 1915" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">Apollo · 进程架构</title>
<desc id="desc">轻量副本制游戏服务器引擎。客户端经 Gateway 接入；Login 承担认证与在线目录；World 为管理端，cellServer 为独立模拟执行端，二者经 960 注册/961 裁决/962 分配/963 retire/967 自报 协调；Base 管玩家档案与基础业务并落 database；interfaces 接平台回调；machined 拉起并监督各进程；logger/admin 收集日志与指标。虚线为控制，实线为业务数据。图示为目标契约，不代表已全部实现。</desc>
<defs><marker id="arrow-087f5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f5b"/></marker><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker><marker id="arrow-475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#475569"/></marker><marker id="arrow-6366f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#6366f1"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7c3aed"/></marker><marker id="arrow-c2410c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#c2410c"/></marker></defs>
<style>text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172b4d}.title{font-size:30px;font-weight:700}.name{font-size:23px;font-weight:700}.body{font-size:17px;fill:#435570}.small{font-size:15px;fill:#52647b}.label{font-size:15px;fill:#435570;paint-order:stroke;stroke:#f8fafc;stroke-width:5px;stroke-linejoin:round}.edge{fill:none;stroke-linejoin:round}.control{stroke-dasharray:7 5}</style>
<rect width="1280" height="1915" rx="20" fill="#f8fafc"/>
<text x="40" y="48" class="title" text-anchor="start">Apollo · 进程架构</text>
<text x="40" y="80" class="body" text-anchor="start">轻量副本制游戏服务器 · 管理端与执行端分离 · 单区服闭环，持续实现中</text>

